# Marsa Atlas MCP — Cloudflare Workers configuration.
# Placeholders only: never commit account ids or tokens.
# Deploy with:  CLOUDFLARE_API_TOKEN=... CLOUDFLARE_ACCOUNT_ID=... bun run deploy
name = "marsa-atlas-mcp"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
# account_id = "<YOUR_CLOUDFLARE_ACCOUNT_ID>"   # or set CLOUDFLARE_ACCOUNT_ID

# Expose on <name>.<your-subdomain>.workers.dev (handy for forks/self-hosting).
workers_dev = true

# Mount on an existing proxied hostname without touching its other paths, e.g.:
# routes = [
#   { pattern = "atlas.example.org/mcp*", zone_name = "example.org" },
# ]

[vars]
ATLAS_API_URL = "https://atlas.marsaplatform.com"
ATLAS_DATA_MODE = "api"

[observability]
enabled = true
